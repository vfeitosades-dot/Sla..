name: Horizon Pocket VR · Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'horizon-pocket-vr/**'
      - '.github/workflows/horizon-pocket-vr.yml'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract application sources
        run: |
          cd horizon-pocket-vr
          base64 --decode source.tar.gz.b64 | tar -xz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMGR=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"
      - name: Bundle offline hand tracking model
        run: |
          mkdir -p horizon-pocket-vr/assets/vendor/hands
          npm install --no-save --ignore-scripts --no-audit --prefix /tmp/horizon-hands @mediapipe/hands@0.4.1675469240
          cp -R /tmp/horizon-hands/node_modules/@mediapipe/hands/. horizon-pocket-vr/assets/vendor/hands/
          test -s horizon-pocket-vr/assets/vendor/hands/hands.js
          du -sh horizon-pocket-vr/assets/vendor/hands
      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('horizon-pocket-vr/assets/index.html').read_text()
          Path('/tmp/horizon-app.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/horizon-app.js
      - name: Build signed Android APK
        run: bash horizon-pocket-vr/build.sh
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-Pocket-VR-APK
          path: horizon-pocket-vr/output/Horizon-Pocket-VR.apk
      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "horizon-pocket-vr-2-${GITHUB_RUN_NUMBER}" \
            --title "Horizon Pocket VR · v2 · mãos 3D e sensores · build ${GITHUB_RUN_NUMBER}" \
            --notes "V2 Android: mãos 3D articuladas; rastreamento MediaPipe local pela câmera traseira; rotação com sensores Android (vetor de rotação ou acelerômetro+bússola); fluxo óptico e modo VR Box. Sem 6DoF e sujeito a limitações da câmera e dos sensores. Build de desenvolvimento, sem testes em aparelho físico." \
            horizon-pocket-vr/output/Horizon-Pocket-VR.apk
